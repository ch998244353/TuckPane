<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --surface: #34414A;
      --editor: #43515B;
      --accent: #9BB6C5;
      --border: #5F707A;
      --text: #F1F4F5;
      --muted: #BAC3C8;
      --rule: rgba(95, 112, 122, 0.5);
      --caret: #FFFFFF;
      --scroll-thumb: #343F47;
      --scroll-thumb-hover: #2F3940;
      --font-size: 14px;
      --ruled-line-height: 25.2px;
      --ruled-background-offset: 11.2px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--editor); }
    body { color: var(--text); font-family: "Segoe UI Variable Text", "Microsoft YaHei UI", sans-serif; }
    #editor {
      width: 100%; height: 100%; padding: 14px 16px 28px; overflow: auto; overflow-x: hidden;
      outline: none; white-space: pre-wrap; overflow-wrap: anywhere; caret-color: var(--caret);
      color: var(--text); background: var(--editor); font-size: var(--font-size); line-height: var(--ruled-line-height);
      letter-spacing: 0.04em;
    }
    #editor::-webkit-scrollbar { width: 10px; }
    #editor::-webkit-scrollbar-track, #editor::-webkit-scrollbar-corner { background: var(--editor); }
    #editor::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb); border: 2px solid var(--editor); border-radius: 999px;
    }
    #editor::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
    #editor[data-ruled-lines] {
      background-image: linear-gradient(to bottom, transparent calc(100% - 1px), var(--rule) 0);
      background-position: 0 var(--ruled-background-offset);
      background-size: 100% var(--ruled-line-height);
      background-attachment: local;
    }
    #editor:empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
    #editor img { display: inline-block; max-width: 100%; height: auto; margin: 6px 2px; vertical-align: top; }
    #editor img[data-selected="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
    .handle {
      position: fixed; width: 14px; height: 14px; border: 2px solid var(--editor);
      border-radius: 50%; background: var(--accent); z-index: 10; touch-action: none;
    }
    .handle[hidden] { display: none; }
    #nw, #se { cursor: nwse-resize; }
    #ne, #sw { cursor: nesw-resize; }
  </style>
</head>
<body>
  <main id="editor" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="true"></main>
  <div id="nw" class="handle" data-x="-1" hidden role="slider" aria-label="Resize image"></div>
  <div id="ne" class="handle" data-x="1" hidden role="slider" aria-label="Resize image"></div>
  <div id="sw" class="handle" data-x="-1" hidden role="slider" aria-label="Resize image"></div>
  <div id="se" class="handle" data-x="1" hidden role="slider" aria-label="Resize image"></div>
  <script>
    (() => {
      'use strict';
      const editor = document.getElementById('editor');
      const handles = [...document.querySelectorAll('.handle')];
      let selectedImage = null;
      let fontSize = 14;
      let resize = null;
      let notifyTimer = 0;
      let diagnostics = false;
      let lastTimingSample = -1000;
      let pastedImageLabel = 'Pasted image';
      let composing = false;
      let blankLinePress = null;
      const editorTopPadding = 14;
      const ruledLineHeightRatio = 1.8;
      const ruledLowerGapRatio = 0.2;
      const imageVerticalMargin = 6;

      const alignToDevicePixel = value => {
        const scale = Math.max(1, Number(window.devicePixelRatio) || 1);
        return Math.round(value * scale) / scale;
      };

      function applyFontMetrics(size) {
        fontSize = Math.max(8, Math.min(48, Number(size) || 14));
        const lineHeight = alignToDevicePixel(fontSize * ruledLineHeightRatio);
        const lowerGap = alignToDevicePixel(fontSize * ruledLowerGapRatio);
        const backgroundOffset = editorTopPadding - lowerGap;
        document.documentElement.style.setProperty('--font-size', `${fontSize}px`);
        document.documentElement.style.setProperty('--ruled-line-height', `${lineHeight}px`);
        document.documentElement.style.setProperty('--ruled-background-offset', `${backgroundOffset}px`);
        alignImagesToRuledGrid();
      }

      function alignImageToRuledGrid(image) {
        if (!editor.hasAttribute('data-ruled-lines')) {
          image.style.removeProperty('margin-bottom');
          return;
        }
        const height = image.getBoundingClientRect().height;
        if (height <= 0) return;
        const lineHeight = alignToDevicePixel(fontSize * ruledLineHeightRatio);
        const occupied = imageVerticalMargin + height + imageVerticalMargin;
        const aligned = Math.ceil(occupied / lineHeight - 1e-6) * lineHeight;
        image.style.marginBottom = `${alignToDevicePixel(Math.max(
          imageVerticalMargin,
          aligned - imageVerticalMargin - height))}px`;
      }

      function alignImagesToRuledGrid() {
        editor.querySelectorAll('img').forEach(alignImageToRuledGrid);
      }

      const post = payload => window.chrome?.webview?.postMessage(payload);
      const scheduleChanged = () => {
        clearTimeout(notifyTimer);
        notifyTimer = setTimeout(() => post({ type: 'changed', html: cleanHtml(editor.innerHTML), fontSize }), 350);
      };

      function cleanHtml(html) {
        const template = document.createElement('template');
        template.innerHTML = html || '';
        const output = document.createElement('div');
        const append = (source, target) => {
          for (const node of source.childNodes) {
            if (node.nodeType === Node.TEXT_NODE) {
              target.append(document.createTextNode(node.textContent || ''));
              continue;
            }
            if (node.nodeType !== Node.ELEMENT_NODE) continue;
            const tag = node.tagName.toLowerCase();
            if (tag === 'img') {
              const src = node.getAttribute('src') || '';
              if (!/^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+/=\s]+$/i.test(src)) continue;
              const image = document.createElement('img');
              image.src = src;
              image.alt = node.getAttribute('alt') || pastedImageLabel;
              image.tabIndex = 0;
              const width = Math.round(Number.parseFloat(node.style.width || node.getAttribute('width') || '0'));
              if (Number.isFinite(width) && width > 0) image.style.width = `${Math.min(4096, width)}px`;
              target.append(image);
              continue;
            }
            if (tag === 'br') {
              target.append(document.createElement('br'));
              continue;
            }
            const container = tag === 'div' || tag === 'p' ? document.createElement('div') : target;
            append(node, container);
            if (container !== target) target.append(container);
          }
        };
        append(template.content, output);
        return output.innerHTML;
      }

      function insertNodeAtSelection(node) {
        const selection = window.getSelection();
        let range = selection && selection.rangeCount ? selection.getRangeAt(0) : null;
        if (!range || !editor.contains(range.commonAncestorContainer)) {
          range = document.createRange();
          range.selectNodeContents(editor);
          range.collapse(false);
        }
        range.deleteContents();
        range.insertNode(node);
        range.setStartAfter(node);
        range.collapse(true);
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function insertText(text) {
        const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
        lines.forEach((line, index) => {
          if (index) insertNodeAtSelection(document.createElement('br'));
          if (line) insertNodeAtSelection(document.createTextNode(line));
        });
        scheduleChanged();
      }

      function setRuledLines(show) {
        editor.toggleAttribute('data-ruled-lines', Boolean(show));
        alignImagesToRuledGrid();
      }

      function insertImage(file) {
        if (!/^image\/(png|jpe?g|gif|webp)$/i.test(file.type)) return;
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.alt = pastedImageLabel;
          image.tabIndex = 0;
          image.onload = () => {
            const maximum = Math.max(96, editor.clientWidth - 40);
            image.style.width = `${Math.max(48, Math.min(maximum, image.naturalWidth || maximum))}px`;
            insertNodeAtSelection(image);
            insertNodeAtSelection(document.createElement('br'));
            alignImageToRuledGrid(image);
            selectImage(image);
            scheduleChanged();
          };
          image.src = String(reader.result || '');
        };
        reader.readAsDataURL(file);
      }

      function selectImage(image) {
        if (selectedImage) selectedImage.removeAttribute('data-selected');
        selectedImage = image;
        if (selectedImage) selectedImage.setAttribute('data-selected', 'true');
        positionHandles();
      }

      // Inputs are content coordinates, so scrolling and font/DPI changes do not
      // change which visual line the click addresses. The empty editor has row 0.
      function blankLinesToAppend(contentY, lastLineTop, lineHeight) {
        if (![contentY, lastLineTop, lineHeight].every(Number.isFinite) || lineHeight <= 0) return 0;
        return Math.max(0, Math.floor((contentY - lastLineTop) / lineHeight + 1e-6));
      }

      function placeCaretOnBlankLine(event) {
        const press = blankLinePress;
        blankLinePress = null;
        if (!press || event.target !== editor || event.button !== 0 || event.detail !== 1 ||
            event.shiftKey || event.ctrlKey || event.altKey || event.metaKey || composing || resize ||
            Math.hypot(event.clientX - press.x, event.clientY - press.y) > 4) return;
        // Do not interpret a scrollbar click or an image still loading as blank paper.
        const bounds = editor.getBoundingClientRect();
        if (event.clientX >= bounds.left + editor.clientWidth ||
            [...editor.querySelectorAll('img')].some(image => !image.complete)) return;
        const style = getComputedStyle(editor);
        const lineHeight = Number.parseFloat(style.lineHeight);
        const origin = bounds.top + Number.parseFloat(style.paddingTop) - editor.scrollTop;
        const range = document.createRange();
        range.selectNodeContents(editor);
        const rects = [...range.getClientRects()].filter(rect => rect.height > 0);
        let contentBottom = origin + lineHeight;
        for (const rect of rects) contentBottom = Math.max(contentBottom, rect.bottom);
        for (const image of editor.querySelectorAll('img')) {
          contentBottom = Math.max(contentBottom, image.getBoundingClientRect().bottom +
            (Number.parseFloat(getComputedStyle(image).marginBottom) || 0));
        }
        if (editor.childNodes.length && !rects.length) return;
        let tail = editor;
        while (tail.lastElementChild && tail.lastChild === tail.lastElementChild &&
            /^(DIV|P)$/.test(tail.lastElementChild.tagName)) tail = tail.lastElementChild;
        range.selectNodeContents(tail);
        range.collapse(false);
        if (tail.lastChild?.nodeType === Node.TEXT_NODE)
          range.setStart(tail.lastChild, tail.lastChild.textContent.length);
        else if (tail.lastChild?.nodeName === 'BR') range.setStartBefore(tail.lastChild);
        range.collapse(true);
        let lastLineTop = 0;
        if (tail !== editor) {
          // Blocks include their actual line boxes, including arbitrary-height
          // images. Do not snap their bottom to the paper's global ruled grid.
          lastLineTop = tail.getBoundingClientRect().bottom - origin - lineHeight;
        } else if (tail.lastChild?.nodeName === 'IMG') {
          lastLineTop = contentBottom - origin - lineHeight;
        } else if (tail.childNodes.length) {
          let caretRects = [...range.getClientRects()].filter(rect => rect.height > 0);
          if (!caretRects.length && tail.lastChild?.nodeName === 'BR') {
            const breakRange = document.createRange();
            breakRange.selectNode(tail.lastChild);
            caretRects = [...breakRange.getClientRects()].filter(rect => rect.height > 0);
          }
          const caret = caretRects.at(-1);
          if (!caret) return;
          // Text ranges measure glyph boxes; remove the half-leading to recover
          // the line top, which may be offset by an unruled image above it.
          lastLineTop = caret.top - origin - (lineHeight - caret.height) / 2;
        }
        // A trailing <br> beside a tall, top-aligned image has a short glyph box
        // near the image's top. New paragraphs still start below the whole image.
        lastLineTop = Math.max(0, lastLineTop, contentBottom - origin - lineHeight);
        const count = blankLinesToAppend(event.clientY - origin, lastLineTop, lineHeight);
        if (!count) return;

        const selection = window.getSelection();
        if (!selection || !selection.isCollapsed) return;
        editor.focus({ preventScroll: true });
        // Put the caret inside the final paragraph, before its placeholder <br>.
        selection.removeAllRanges();
        selection.addRange(range);
        // Native editing commands retain the browser's editing/undo semantics.
        // Insertion occurs only at the end; existing text and image nodes stay intact.
        for (let index = 0; index < count; index++) {
          if (!document.execCommand('insertParagraph', false)) break;
        }
        selectImage(null);
        scheduleChanged();
      }

      function positionHandles() {
        if (!selectedImage || !selectedImage.isConnected) {
          selectedImage = null;
          handles.forEach(handle => handle.hidden = true);
          return;
        }
        const rect = selectedImage.getBoundingClientRect();
        const points = [[rect.left, rect.top], [rect.right, rect.top], [rect.left, rect.bottom], [rect.right, rect.bottom]];
        handles.forEach((handle, index) => {
          handle.hidden = false;
          handle.style.left = `${points[index][0] - 7}px`;
          handle.style.top = `${points[index][1] - 7}px`;
          handle.setAttribute('aria-valuenow', String(Math.round(rect.width)));
        });
      }

      editor.addEventListener('input', event => {
        scheduleChanged();
        if (!diagnostics) return;
        const now = performance.now();
        if (now - lastTimingSample < 1000) return;
        lastTimingSample = now;
        const eventMs = Math.max(0, now - event.timeStamp);
        requestAnimationFrame(() => post({ type: 'editorTiming', eventMs,
          frameMs: performance.now() - now, utcMs: Date.now() }));
      });
      editor.addEventListener('scroll', positionHandles, { passive: true });
      window.addEventListener('resize', () => {
        applyFontMetrics(fontSize);
        positionHandles();
      });
      editor.addEventListener('compositionstart', () => { composing = true; blankLinePress = null; });
      editor.addEventListener('compositionend', () => { composing = false; });
      editor.addEventListener('pointerdown', event => {
        const selection = window.getSelection();
        blankLinePress = event.button === 0 && event.isPrimary && !composing &&
          !event.shiftKey && !event.ctrlKey && !event.altKey && !event.metaKey &&
          (!selection || selection.isCollapsed)
          ? { x: event.clientX, y: event.clientY } : null;
      });
      editor.addEventListener('pointermove', event => {
        if (blankLinePress && Math.hypot(event.clientX - blankLinePress.x, event.clientY - blankLinePress.y) > 4)
          blankLinePress = null;
      });
      editor.addEventListener('pointercancel', () => { blankLinePress = null; });
      editor.addEventListener('click', event => {
        placeCaretOnBlankLine(event);
        selectImage(event.target instanceof HTMLImageElement ? event.target : null);
      });
      editor.addEventListener('focusin', event => {
        if (event.target instanceof HTMLImageElement) selectImage(event.target);
      });
      editor.addEventListener('paste', event => {
        event.preventDefault();
        const images = [...(event.clipboardData?.items || [])]
          .filter(item => item.kind === 'file' && item.type.startsWith('image/'))
          .map(item => item.getAsFile()).filter(Boolean);
        if (images.length) images.forEach(insertImage);
        else insertText(event.clipboardData?.getData('text/plain') || '');
      });
      editor.addEventListener('copy', event => {
        const text = window.getSelection()?.toString() || '';
        if (!text) return;
        event.preventDefault();
        setTimeout(() => post({ type: 'copyText', text }), 0);
      });
      function onCutText(event) {
        const text = window.getSelection()?.toString() || '';
        if (!text) return;
        // Preserve the browser's deletion and undo; the host adds history support
        // after the default cut has finished writing to the clipboard.
        setTimeout(() => post({ type: 'copyText', text }), 0);
      }
      editor.addEventListener('cut', onCutText);
      editor.addEventListener('wheel', event => {
        if (!event.ctrlKey) return;
        event.preventDefault();
        applyFontMetrics(fontSize + (event.deltaY < 0 ? 1 : -1));
        post({ type: 'fontSize', fontSize });
        scheduleChanged();
      }, { passive: false });
      editor.addEventListener('keydown', event => {
        if (!selectedImage) return;
        if (event.key === 'Delete' || event.key === 'Backspace') {
          event.preventDefault();
          selectedImage.remove();
          selectImage(null);
          scheduleChanged();
        } else if (event.altKey && (event.key === 'ArrowLeft' || event.key === 'ArrowRight')) {
          event.preventDefault();
          const width = Math.max(48, Math.min(editor.clientWidth - 40,
            selectedImage.getBoundingClientRect().width + (event.key === 'ArrowRight' ? 8 : -8)));
          selectedImage.style.width = `${Math.round(width)}px`;
          alignImageToRuledGrid(selectedImage);
          positionHandles();
          scheduleChanged();
        }
      });

      handles.forEach(handle => {
        handle.addEventListener('pointerdown', event => {
          if (!selectedImage) return;
          event.preventDefault();
          handle.setPointerCapture(event.pointerId);
          const rect = selectedImage.getBoundingClientRect();
          resize = { pointerId: event.pointerId, startX: event.clientX, width: rect.width, direction: Number(handle.dataset.x) || 1 };
        });
        handle.addEventListener('pointermove', event => {
          if (!resize || resize.pointerId !== event.pointerId || !selectedImage) return;
          const delta = (event.clientX - resize.startX) * resize.direction;
          const width = Math.max(48, Math.min(editor.clientWidth - 40, resize.width + delta));
          selectedImage.style.width = `${Math.round(width)}px`;
          selectedImage.style.height = 'auto';
          alignImageToRuledGrid(selectedImage);
          positionHandles();
        });
        const finish = event => {
          if (!resize || resize.pointerId !== event.pointerId) return;
          resize = null;
          scheduleChanged();
        };
        handle.addEventListener('pointerup', finish);
        handle.addEventListener('pointercancel', finish);
      });

      window.__tuckpane = {
        load(html, size, palette, ruledLines, placeholder, languageTag, imageLabel, resizeLabel, traceInput = false) {
          diagnostics = Boolean(traceInput);
          document.documentElement.lang = languageTag || 'en-US';
          pastedImageLabel = imageLabel || 'Pasted image';
          handles.forEach(handle => handle.setAttribute('aria-label', resizeLabel || 'Resize image'));
          editor.innerHTML = cleanHtml(html);
          editor.querySelectorAll('img').forEach(image => {
            image.alt = pastedImageLabel;
            if (!image.complete) image.addEventListener('load', () => alignImageToRuledGrid(image), { once: true });
          });
          editor.dataset.placeholder = placeholder || '';
          applyFontMetrics(size);
          for (const [key, value] of Object.entries(palette || {}))
            document.documentElement.style.setProperty(`--${key}`, String(value));
          setRuledLines(ruledLines);
          editor.focus();
          post({ type: 'ready' });
        },
        setTheme(palette) {
          for (const [key, value] of Object.entries(palette || {}))
            document.documentElement.style.setProperty(`--${key}`, String(value));
        },
        setRuledLines,
        getState() { return { html: cleanHtml(editor.innerHTML), fontSize }; }
      };
      post({ type: 'shellReady' });
    })();
  </script>
</body>
</html>
