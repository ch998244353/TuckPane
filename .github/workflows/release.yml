name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\scripts\build-release.ps1 -Version $version -OutputName "v$version"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME `
            ".\artifacts\release\v$version\TuckPane-$version-win-x64-setup.exe" `
            ".\artifacts\release\v$version\TuckPane-$version-win-x64-portable.zip" `
            ".\artifacts\release\v$version\SHA256SUMS.txt" `
            --verify-tag `
            --title "TuckPane $version" `
            --notes-file .\RELEASE_NOTES.md
